base_url: https://gatewayuat.wolaicaipay.com
headers:
  Content-Type: application/json
  platform: operation
  clienttype: wlc-manage
login:
  # 请求体取自 data/account/uat.yaml 中对应角色的 body
  url: /wlc-service/smartApi/user/accountLogin?debug=debug
  method: post
  expected_status_code: 200
  success_codes:
    - 200
  # token 在登录响应中的路径，值形如 "Bearer xxx"
  token_path: data.jwtToken
  # 登录态通过 Cookie 携带：固定 Cookie + eh_uatJwtToken=<URL 编码后的 token>
